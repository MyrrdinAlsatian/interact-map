openapi: 3.0.3
info:
  title: Hypermedia Architecture API Contract
  version: 0.2.0
  description: Session authentication and role policies apply outside development; development mode bypasses them for local iteration.
servers:
  - url: http://localhost:3333
security:
  - sessionCookie: []
paths:
  /health:
    get:
      summary: Health probe
      security: []
      responses:
        '200':
          description: Service healthy
  /login:
    get:
      summary: Render sign-in form
      security: []
      responses:
        '200':
          description: Sign-in page
          content:
            text/html:
              schema: { type: string }
    post:
      summary: Create an authenticated session
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Session created for JSON clients
        '302':
          description: Browser redirected to the dashboard
        '401':
          description: Email or password is incorrect
  /logout:
    post:
      summary: End the authenticated session
      responses:
        '200':
          description: Session ended for JSON clients
        '302':
          description: Browser redirected to the sign-in page
        '401':
          description: Authentication required
  /register:
    get:
      summary: Render account registration form
      security: []
      responses:
        '200':
          description: Registration page
          content:
            text/html:
              schema: { type: string }
  /users/all:
    get:
      summary: Get all users
      description: Admin-only account listing; each user includes their stored role.
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, email, displayName, role]
                  properties:
                    id: { type: string }
                    email: { type: string, format: email }
                    displayName: { type: string }
                    role: { type: string, enum: [viewer, editor, security, admin] }
        '401':
          description: Authentication required
        '403':
          description: Admin role required
  /users/register:
    post:
      summary: Register user (development auth flow)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, password]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                password: { type: string, minLength: 8 }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, displayName, password]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: User created for JSON clients
        '302':
          description: Browser redirected to sign-in after registration
        '422':
          description: Validation error
  /graph/contract/validate:
    post:
      summary: Validate graph contract payload
      description: Requires editor or higher; accepts current and previous schema versions only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphContract'
      responses:
        '200':
          description: Contract payload is valid
        '422':
          description: Contract payload rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
        '403':
          description: Editor role required
  /graph/simulate-incident:
    post:
      summary: Simulate graph impact from a failing node
      description: Requires authenticated user with role `editor` or higher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, failedNodeId]
              properties:
                projectId: { type: string }
                failedNodeId: { type: string }
                traversal:
                  type: string
                  enum: [bfs, dfs]
      responses:
        '200':
          description: Incident impact result
        '403':
          description: Role does not permit simulation
        '401':
          description: Authentication required
  /parser/ingest:
    post:
      summary: Ingest a normalized parser result
      description: Requires editor or higher; validates and merges a ParserResult into the stored graph.
      responses:
        '200':
          description: Parser result accepted
        '403':
          description: Editor role required
        '422':
          description: Parser result or graph contract rejected
  /uploads:
    post:
      summary: Parse and import an infrastructure file
      description: Requires editor or higher. Accepts multipart form data or JSON payloads.
      responses:
        '200':
          description: Infrastructure data parsed and imported
        '403':
          description: Editor role required
        '422':
          description: Upload or parsed graph rejected
  /nodes/{id}/archive:
    post:
      summary: Archive a graph node
      description: Requires editor or higher.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirected to the node inventory
        '403':
          description: Editor role required
  /nodes/{id}/restore:
    post:
      summary: Restore an archived graph node
      description: Requires editor or higher.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirected to the node inventory
        '403':
          description: Editor role required
  /nodes/{id}/purge:
    post:
      summary: Permanently purge a graph node
      description: Requires admin. Permanently removes the node and its incident edges.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirected to the node inventory
        '403':
          description: Admin role required
  /fragments/{target}:
    get:
      summary: Resolve server-rendered fragment for Unpoly requests
      parameters:
        - in: path
          name: target
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fragment resolved
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Missing fragment target with fallback metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /observability/metrics:
    get:
      summary: Read core service metrics
      description: Exposes request latency and error counters.
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreMetrics'
  /audit/logs:
    get:
      summary: Query audit records
      description: Read-only access for the `security` role and higher.
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
        '403':
          description: Role does not permit audit access
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: adonis-session
  schemas:
    GraphContract:
      type: object
      required: [schemaVersion, nodes, edges, errors]
      properties:
        schemaVersion:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ContractError'
    GraphNode:
      type: object
      required: [id, type, label]
      properties:
        id: { type: string }
        type: { type: string, enum: [application, service, container, server, external] }
        label: { type: string }
        metadata: { type: object, additionalProperties: true }
    GraphEdge:
      type: object
      required: [id, source, target, criticality]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        criticality: { type: string, enum: [critical, high, medium, low] }
        dependencyType: { type: string, enum: [required, optional, async, cache] }
        protocol: { type: string }
    ContractError:
      type: object
      required: [code, message, severity]
      properties:
        code: { type: string }
        message: { type: string }
        path: { type: string }
        severity: { type: string, enum: [error, warning] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ContractError'
        fallbackNavigation:
          type: string
          enum: [full_page]
    CoreMetrics:
      type: object
      required: [request_latency_ms, fragment_error_count, parse_error_count]
      properties:
        request_latency_ms: { type: number }
        fragment_error_count: { type: integer }
        parse_error_count: { type: integer }
    AuditLogEntry:
      type: object
      required: [id, actorId, actorRole, action, resourceType, resourceId, timestamp, outcome]
      properties:
        id: { type: string }
        actorId: { type: string }
        actorRole: { type: string, enum: [viewer, security, editor, admin] }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        timestamp: { type: string, format: date-time }
        outcome: { type: string, enum: [success, denied, failure] }
        metadata:
          type: object
          additionalProperties: true
